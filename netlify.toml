# Blooket Enhanced v2 — Netlify configuration.
# The site is plain HTML/CSS/JS in /public (no build step); /api/* runs on Netlify Server
# (netlify/server/index.mjs) and data is stored in Netlify Database (Postgres).

[build]
  publish = "public"
  command = "echo 'No build step needed'"

[build.environment]
  # Netlify Server needs Node.js 24 or later.
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
